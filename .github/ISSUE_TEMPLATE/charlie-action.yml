name: Do something for Charlie
description: Pet her, toss her a treat, fill her bowl, play with her.
title: "🐾 for Charlie"
labels: ["for-charlie", "action"]
body:
  - type: dropdown
    id: action
    attributes:
      label: What do you do?
      options:
        - pet her
        - toss a treat
        - fill her bowl
        - squeak the lemon tart
        - roll her a ball
        - tap on the window
        - ring the doorbell
        - fluff her blanket
        - something else
    validations:
      required: true
  - type: input
    id: custom
    attributes:
      label: Something else? (optional)
      description: One of the things you can do at her builds, as listed on her site.
  - type: markdown
    attributes:
      value: Press **Submit**. Charlie feels it within about 15 minutes, and you'll see it on her site.
