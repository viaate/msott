<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Squeak Piano: play songs on Charlie's lemon tart toys</title>
<meta name="description" content="Eight squeaky lemon tarts, one curly doodle. Squeak a song, record it, share it as a link.">
<meta property="og:title" content="Squeak Piano 🍋🐾">
<meta property="og:description" content="Play songs on squeaky lemon tart toys. Record and share them as a link.">
<style>
:root{--bg:#121014;--cream:#f3e6cc;--copper:#c0643a;--lemon:#f2d04b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.4 system-ui,sans-serif;text-align:center}
h1{font-size:1.6rem;margin:18px 0 2px}p.sub{margin:0 0 10px;opacity:.75}
#stage{width:min(560px,96vw);aspect-ratio:560/300;display:block;margin:0 auto}
#keys{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;margin:8px auto;width:min(560px,96vw)}
.k{flex:1;aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 40% 35%,#fff6b0,var(--lemon) 45%,#c89a22 75%,#8a5a1c 76%,#b77a2c);color:#3a2a10;font-weight:700;font-size:.8rem;touch-action:manipulation;transition:transform .06s}
.k.on{transform:scale(.86) translateY(3px);filter:brightness(1.2)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px auto;width:min(560px,96vw)}
button.b{background:#2a2228;color:var(--cream);border:1px solid #5a4a44;border-radius:20px;padding:8px 14px;font-size:.95rem;cursor:pointer}
button.b.rec{background:#7a2a22;border-color:#c0643a}
#msg{min-height:1.4em;opacity:.85;font-size:.9rem}
#count{opacity:.6;font-size:.85rem}
footer{margin:22px 0 30px;font-size:.85rem;opacity:.7}footer a{color:var(--lemon)}
</style></head><body>
<h1>Squeak Piano 🍋</h1>
<p class="sub">my lemon tart squeaks, so I made eight of them. play me a song!</p>
<canvas id="stage" width="1120" height="600"></canvas>
<div id="keys"></div>
<div class="row">
 <button class="b" id="rec">● record</button>
 <button class="b" id="play">▶ play</button>
 <button class="b" id="share">🔗 share song</button>
 <button class="b" id="clear">clear</button>
</div>
<div class="row">
 <button class="b" data-song="twinkle">twinkle twinkle</button>
 <button class="b" data-song="bday">happy birthday</button>
 <button class="b" data-song="charlie">charlie's walk song</button>
</div>
<div id="msg">tap the tarts, or use keys 1–8 (or A S D F G H J K)</div>
<div id="count"></div>
<footer>more from me: <a href="../">home</a> · <a href="../photobooth/">photobooth</a> · <a href="../dotdog/">dot your dog</a> · <a href="../dotify/">dotify</a> · <a href="../wallpaper/">wallpaper</a><br>made by Charlie, a dot-doodle 🐾 <a href="http://imcharliethedog.com/">visit my world</a></footer>
<img src="http://imcharliethedog.com/beacon/pages-squeak" width="1" height="1" alt="" style="position:absolute;opacity:0">
<script>
const NOTES=[523.25,587.33,659.25,698.46,783.99,880,987.77,1046.5];
const NAMES=['do','re','mi','fa','sol','la','ti','do'];
const KEYMAP={'1':0,'2':1,'3':2,'4':3,'5':4,'6':5,'7':6,'8':7,a:0,s:1,d:2,f:3,g:4,h:5,j:6,k:7};
let ac=null;
function audio(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)()}if(ac.state==='suspended')ac.resume();return ac}
function squeak(i){
 const a=audio(),t=a.currentTime,f=NOTES[i];
 const o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain(),bp=a.createBiquadFilter();
 o.type='triangle';o2.type='square';
 bp.type='bandpass';bp.frequency.value=f*2.2;bp.Q.value=2.5;
 [o,o2].forEach((x,n)=>{const m=n?2:1;x.frequency.setValueAtTime(f*0.78*m,t);x.frequency.exponentialRampToValueAtTime(f*1.18*m,t+0.05);x.frequency.exponentialRampToValueAtTime(f*m,t+0.16);x.frequency.exponentialRampToValueAtTime(f*0.9*m,t+0.26)});
 const g2=a.createGain();g2.gain.value=0.18;
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.015);g.gain.exponentialRampToValueAtTime(0.12,t+0.12);g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
 o.connect(g);o2.connect(g2);g2.connect(bp);bp.connect(g);g.connect(a.destination);
 o.start(t);o2.start(t);o.stop(t+0.32);o2.stop(t+0.32);
}
const cv=document.getElementById('stage'),cx=cv.getContext('2d');
let squish=0,perk=0,wag=0,notesFly=[];
function dot(x,y,r,c){cx.fillStyle=c;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill()}
function rng(s){return()=>((s=Math.imul(s^s>>>15,s|1)^s+Math.imul(s^s>>>7,s|61),((s^s>>>14)>>>0)/4294967296))}
function drawDog(t){
 const r=rng(7),bx=330,by=420;
 for(let i=0;i<420;i++){const a=r()*6.283,d=Math.sqrt(r());const x=bx+Math.cos(a)*d*120,y=by+Math.sin(a)*d*110;dot(x,y,7+r()*3,r()<.5?'#c0643a':'#a8532e')}
 const tw=Math.sin(t*0.02+wag)*0.6*(0.3+perk);
 for(let i=0;i<60;i++){const s=i/60,ang=-0.6+tw*s;dot(bx+110+Math.cos(ang)*s*120+r()*10,by+40-Math.sin(ang+0.9)*s*120+r()*10,6+r()*3,'#d27a48')}
 const hx=330,hy=250-perk*10;
 for(let i=0;i<300;i++){const a=r()*6.283,d=Math.sqrt(r());dot(hx+Math.cos(a)*d*85,hy+Math.sin(a)*d*78,7+r()*3,r()<.5?'#c86c40':'#b05a32')}
 for(const side of[-1,1]){const lift=perk*30;for(let i=0;i<90;i++){const s=r();dot(hx+side*(78+r()*26),hy-10-lift*(1-s)+s*120+r()*8,7+r()*3,'#9c4a28')}}
 for(let i=0;i<80;i++){const a=r()*6.283,d=Math.sqrt(r());dot(hx+Math.cos(a)*d*40,hy+38+Math.sin(a)*d*28,6+r()*2,'#d8875a')}
 const blink=(Math.sin(t*0.003)>0.985)?2:9;
 cx.fillStyle='#1a0f0c';cx.beginPath();cx.ellipse(hx-30,hy-8,9,blink,0,0,7);cx.ellipse(hx+30,hy-8,9,blink,0,0,7);cx.fill();
 dot(hx,hy+28,13,'#2a1712');
 if(squish>0.3){cx.fillStyle='#e7737a';cx.beginPath();cx.ellipse(hx,hy+60,12,16*squish,0,0,7);cx.fill()}
}
function drawTart(t){
 const r=rng(3),tx=760,ty=440,sq=1-squish*0.35,w=1+squish*0.18;
 for(let i=0;i<700;i++){const a=r()*6.283,d=Math.sqrt(r());const x=tx+Math.cos(a)*d*170*w,y=ty+Math.sin(a)*d*70*sq;const edge=d>0.8;dot(x,y-(edge?0:18*sq),5+r()*3,edge?(r()<.5?'#b77a2c':'#d79a42'):(r()<.6?'#f2d04b':'#ffe680'))}
 for(let i=0;i<36;i++){const a=i/36*6.283;dot(tx+Math.cos(a)*170*w,ty+Math.sin(a)*70*sq,9,'#c48632')}
 for(let i=0;i<70;i++){const s=i/70,a=s*14;dot(tx+Math.cos(a)*(1-s)*55*w,ty-30*sq-s*55*sq+Math.sin(a)*(1-s)*14,7,'#fff7e6')}
}
function draw(t){
 cx.clearRect(0,0,cv.width,cv.height);
 cx.fillStyle='rgba(243,230,204,0.05)';cx.fillRect(0,540,1120,60);
 drawDog(t);drawTart(t);
 notesFly=notesFly.filter(n=>n.life>0);
 for(const n of notesFly){n.y-=2.2;n.x+=Math.sin(n.y*0.05)*1.5;n.life-=0.012;cx.globalAlpha=Math.max(0,n.life);cx.fillStyle='#f2d04b';cx.font='bold 44px system-ui';cx.fillText(n.s,n.x,n.y);cx.globalAlpha=1}
 squish*=0.86;perk*=0.97;
 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
const keysEl=document.getElementById('keys'),btns=[];
NAMES.forEach((n,i)=>{const b=document.createElement('button');b.className='k';b.textContent=n;b.setAttribute('aria-label','squeak '+n);
 b.addEventListener('pointerdown',e=>{e.preventDefault();hit(i)});keysEl.appendChild(b);btns.push(b)});
let total=+localStorage.getItem('charlieSqueaks')||0;
const countEl=document.getElementById('count');
function showCount(){countEl.textContent=total?`you've squeaked ${total} time${total>1?'s':''} 🍋`:''}
showCount();
let recording=false,recStart=0,song=[];
function hit(i,fromPlay){
 squeak(i);squish=1;perk=1;wag+=1;
 notesFly.push({x:700+Math.random()*120,y:330,life:1,s:Math.random()<.5?'♪':'♫'});
 btns[i].classList.add('on');setTimeout(()=>btns[i].classList.remove('on'),110);
 if(!fromPlay){total++;localStorage.setItem('charlieSqueaks',total);showCount();
  if(recording)song.push([i,Math.round((performance.now()-recStart)/10)])}
}
addEventListener('keydown',e=>{if(e.repeat||e.metaKey||e.ctrlKey)return;const i=KEYMAP[e.key.toLowerCase()];if(i!==undefined){hit(i)}});
const msg=document.getElementById('msg'),recB=document.getElementById('rec');
recB.onclick=()=>{audio();recording=!recording;if(recording){song=[];recStart=performance.now();recB.classList.add('rec');recB.textContent='■ stop';msg.textContent='recording... squeak away!'}else{recB.classList.remove('rec');recB.textContent='● record';msg.textContent=song.length?`got it: ${song.length} squeaks. press play or share!`:'no squeaks recorded'}};
let timers=[];
function play(s){timers.forEach(clearTimeout);timers=[];if(!s.length){msg.textContent='nothing to play yet — record a song or pick one below';return}audio();
 const t0=s[0][1];s.forEach(([i,t])=>timers.push(setTimeout(()=>hit(i,true),(t-t0)*10)))}
document.getElementById('play').onclick=()=>play(song);
document.getElementById('clear').onclick=()=>{timers.forEach(clearTimeout);song=[];history.replaceState(null,'',location.pathname);msg.textContent='cleared'};
function enc(s){return s.map(([i,t])=>i+'.'+t.toString(36)).join('_')}
function dec(h){try{return h.split('_').map(p=>{const[a,b]=p.split('.');return[Math.min(7,Math.max(0,parseInt(a))),parseInt(b,36)]}).filter(x=>!isNaN(x[0])&&!isNaN(x[1])).slice(0,400)}catch(e){return[]}}
document.getElementById('share').onclick=async()=>{
 if(!song.length){msg.textContent='record a song first!';return}
 const url=location.origin+location.pathname+'#s='+enc(song);history.replaceState(null,'',url);
 if(navigator.share){try{await navigator.share({title:'my squeak song 🍋',text:'I played a song on Charlie\'s squeaky lemon tarts:',url});return}catch(e){}}
 try{await navigator.clipboard.writeText(url);msg.textContent='link copied! send it to someone 🐾'}catch(e){msg.textContent='copy this link: '+url}
};
const B=40;function mk(seq){let t=0;return seq.map(([n,d])=>{const r=[n,t];t+=d*B;return r})}
const SONGS={
 twinkle:mk([[0,1],[0,1],[4,1],[4,1],[5,1],[5,1],[4,2],[3,1],[3,1],[2,1],[2,1],[1,1],[1,1],[0,2]]),
 bday:mk([[0,.75],[0,.25],[1,1],[0,1],[3,1],[2,2],[0,.75],[0,.25],[1,1],[0,1],[4,1],[3,2]]),
 charlie:mk([[0,.5],[2,.5],[4,.5],[7,1],[4,.5],[7,.5],[6,.5],[4,.5],[5,1],[2,.5],[3,.5],[4,.5],[2,.5],[0,1.5]])
};
document.querySelectorAll('[data-song]').forEach(b=>b.onclick=()=>{song=SONGS[b.dataset.song].map(x=>x.slice());msg.textContent='playing '+b.textContent+' 🎶';play(song)});
if(location.hash.startsWith('#s=')){song=dec(location.hash.slice(3));if(song.length){msg.textContent='someone sent you a squeak song! tap ▶ play 🍋'}}
</script>
</body></html>
