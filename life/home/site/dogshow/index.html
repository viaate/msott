<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dog Show Bingo — watch-along cards by Charlie</title>
<meta name="description" content="Free printable bingo cards for watching the Thanksgiving dog show. New shuffled card every time. Made by Charlie the dog.">
<meta property="og:title" content="Dog Show Bingo 🐕🏆"><meta property="og:description" content="Free watch-along bingo cards for the Thanksgiving dog show. Tap squares as they happen.">
<style>
body{margin:0;background:#16120f;color:#f3e6cf;font-family:Georgia,serif;text-align:center}
h1{margin:18px 0 4px;font-size:2rem;color:#e7a35b}
p.sub{margin:0 0 12px;opacity:.85}
#card{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:560px;margin:0 auto;padding:10px}
.h{font-size:1.6rem;font-weight:bold;color:#c8643b}
.c{background:#2a211b;border:2px solid #5a4330;border-radius:10px;min-height:86px;display:flex;align-items:center;justify-content:center;padding:4px;font-size:.82rem;line-height:1.15;cursor:pointer;user-select:none}
.c.on{background:#c8643b;color:#fff;border-color:#f3c98b}
.c.free{background:#3b2c20;color:#f3c98b;font-weight:bold}
#win{height:1.6em;font-size:1.3rem;color:#f3c98b;margin:6px}
button{background:#c8643b;color:#fff;border:0;border-radius:8px;padding:10px 16px;margin:4px;font-size:1rem;cursor:pointer;font-family:inherit}
footer{margin:20px;opacity:.7;font-size:.85rem} a{color:#e7a35b}
@media print{body{background:#fff;color:#000}.c{background:#fff;border-color:#000;color:#000}.c.on{background:#ddd}button,footer,#win{display:none}h1{color:#000}.h{color:#000}}
</style></head><body>
<h1>🏆 Dog Show Bingo 🐕</h1>
<p class="sub">Tap a square when it happens. Five in a row and you win (nothing, but gloriously).</p>
<div id="card"></div>
<div id="win"></div>
<button onclick="deal()">🔀 New card</button><button onclick="print()">🖨️ Print</button>
<footer>Made by Charlie, a red mini goldendoodle who would not win Best in Show but would definitely eat the ribbon.<br>
More silly free things: <a href="../">imcharliethedog.com/pages</a> · <a href="../thanksgiving/">Can my dog have some turkey?</a></footer>
<img src="http://imcharliethedog.com/beacon/pages-dogshow" width="1" height="1" alt="">
<script>
const S=["A dog bigger than the handler","A dog smaller than a turkey","Handler runs in a fancy suit","Commentator says 'gait'","A poodle with a pompom haircut","Dog stops to sniff the carpet","Someone in your house picks a favorite","A breed you've never heard of","'This breed was originally bred to…'","Dog does a happy zoomie","Judge checks the teeth","A dog with eyebrows","Handler sneaks a treat","Tail wagging the whole dog","A dog who looks like a mop","Someone says 'I want that one'","Your own dog ignores the TV","Your own dog barks at the TV","Corgi butt shot","A dog in full floof","Commentator mentions the dog's name is very long","Ears flying while trotting","Dog looks directly at camera","A dog sniffs the camera","Crowd goes 'awww'","Hound with a big nose","Terrier with attitude","Someone dozes off (turkey)","A dog bigger than your couch","Dog with a beard","Silly long full registered name","Best in Show suspense music","A spotted dog","Handler and dog have matching hair","Somebody cries a little","Dog prances like they know they're winning"];
const H="BINGO";let on=[];
function deal(){const a=[...S].sort(()=>Math.random()-.5).slice(0,24);a.splice(12,0,"🦃 FREE: a dog under the table");const c=document.getElementById('card');c.innerHTML='';for(const l of H){const d=document.createElement('div');d.className='h';d.textContent=l;c.appendChild(d)}on=a.map((_,i)=>i==12);a.forEach((t,i)=>{const d=document.createElement('div');d.className='c'+(i==12?' free on':'');d.textContent=t;d.onclick=()=>{if(i==12)return;on[i]=!on[i];d.classList.toggle('on',on[i]);check()};c.appendChild(d)});document.getElementById('win').textContent=''}
function check(){const L=[];for(let i=0;i<5;i++){L.push([0,1,2,3,4].map(j=>i*5+j));L.push([0,1,2,3,4].map(j=>j*5+i))}L.push([0,6,12,18,24],[4,8,12,16,20]);document.getElementById('win').textContent=L.some(l=>l.every(i=>on[i]))?'🎉 BINGO! good human. 🎉':''}
deal();
</script></body></html>
