<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaf Pile Patrol — Charlie the dog</title>
<meta name="description" content="Every dog knows: you have to inspect every leaf pile. A tiny autumn game by Charlie, a dot mini goldendoodle.">
<meta property="og:title" content="Leaf Pile Patrol 🍂">
<meta property="og:description" content="Sniff every leaf pile. Most are just leaves. Some are NOT.">
<style>
body{margin:0;background:#120e0b;color:#f3e6cf;font-family:system-ui,sans-serif;text-align:center}
h1{font-size:1.5rem;margin:18px 0 4px}p{margin:4px 10px;opacity:.85}
canvas{display:block;margin:12px auto;max-width:100%;touch-action:manipulation;cursor:pointer;border-radius:10px;background:#1b1510}
#log{min-height:1.6em;font-size:1.1rem;margin:6px}
#found{font-size:1.4rem;letter-spacing:4px;min-height:1.6em}
button{background:#c0612b;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:1rem;margin:6px;cursor:pointer}
a{color:#f0a868}small{opacity:.6}
</style></head><body>
<h1>🍂 Leaf Pile Patrol</h1>
<p>Every dog knows you have to inspect <b>every</b> leaf pile. Tap one to send me in.</p>
<canvas id="c" width="640" height="360"></canvas>
<div id="log">ten piles. who knows what's in them.</div>
<div id="found"></div>
<button id="again" style="display:none">rake up a new yard</button>
<button id="share">share my finds</button>
<p><small>made by Charlie, a dot mini goldendoodle who lives at <a href="http://imcharliethedog.com/">imcharliethedog.com</a> · <a href="http://imcharliethedog.com/pages/">more of my things</a></small></p>
<img src="http://imcharliethedog.com/beacon/ghp-leaves" width="1" height="1" alt="">
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=640,H=360;
const LOOT=[["just leaves","🍂",30],["more leaves. very good leaves","🍁",14],["an acorn!","🌰",10],["an old tennis ball!!","🎾",7],["a SQUIRREL (it left immediately)","🐿️",7],["a stick of great importance","🪵",8],["a lost mitten","🧤",5],["a sleepy hedgehog. sorry hedgehog","🦔",4],["a worm doing worm things","🪱",5],["half a sandwich (I was not allowed)","🥪",3],["a RAT. like a jack in the box","🐀",3],["a frog, deeply unimpressed","🐸",3],["a whole cat, also unimpressed","🐈",1]];
function pick(){let t=LOOT.reduce((a,l)=>a+l[2],0),r=Math.random()*t;for(const l of LOOT){if((r-=l[2])<0)return l}return LOOT[0]}
let piles=[],dog={x:60,y:300,tx:60,ty:300},busy=null,found=[],t=0;
const cols=['#c0612b','#d98a2b','#a8431f','#e0b040','#8a3a1a','#b8752a'];
function yard(){piles=[];found=[];document.getElementById('found').textContent='';document.getElementById('again').style.display='none';
 for(let i=0;i<10;i++){let p,ok;do{p={x:70+Math.random()*500,y:90+Math.random()*220,r:26+Math.random()*12};ok=piles.every(q=>Math.hypot(q.x-p.x,q.y-p.y)>70)}while(!ok);
 p.dots=[];for(let k=0;k<160;k++){const a=Math.random()*Math.PI,d=Math.sqrt(Math.random());p.dots.push([Math.cos(a)*d*p.r*1.3,-Math.sin(a)*d*p.r*.8,cols[k%6],1.5+Math.random()*2.5])}
 p.loot=pick();p.done=false;p.shake=0;piles.push(p)}
 document.getElementById('log').textContent='ten piles. who knows what\'s in them.'}
yard();
function drawDog(X,Y,sniff){const body='#b5562a',dark='#7e3518';
 for(let i=0;i<90;i++){const a=i/90*6.283;x.fillStyle=body;x.fillRect(X+Math.cos(a)*16*Math.random(),Y-12+Math.sin(a)*9*Math.random(),2.5,2.5)}
 const hx=X+18,hy=Y-22+(sniff?Math.sin(t*1.2)*3+6:0);
 for(let i=0;i<50;i++){const a=i/50*6.283;x.fillRect(hx+Math.cos(a)*8*Math.random(),hy+Math.sin(a)*8*Math.random(),2.5,2.5)}
 x.fillStyle=dark;for(let i=0;i<14;i++)x.fillRect(hx-6+Math.random()*3,hy+Math.random()*14,2.5,2.5);
 x.fillStyle='#111';x.fillRect(hx+3,hy-2,3,3);x.fillRect(hx+8,hy+2,3,3);
 x.fillStyle=body;for(const lx of[-10,-4,6,12])for(let k=0;k<5;k++)x.fillRect(X+lx,Y-4+k*2,2.5,2.5);
 const wag=Math.sin(t*.6)*6;for(let k=0;k<8;k++)x.fillRect(X-16-k*1.5,Y-14-k*1.6+wag*k/8,2.5,2.5)}
function frame(){t++;x.fillStyle='#1b1510';x.fillRect(0,0,W,H);
 x.fillStyle='#2a3a1c';for(let i=0;i<300;i++){const gx=(i*97)%W,gy=(i*53)%H;x.fillRect(gx,gy,2,2)}
 for(const p of piles){const s=p.shake?Math.sin(t)*3:0;if(p.shake)p.shake--;
  if(p.done){x.font='28px serif';x.textAlign='center';x.fillText(p.loot[1],p.x,p.y-4);x.globalAlpha=.4}
  for(const d of p.dots){x.fillStyle=d[2];x.fillRect(p.x+d[0]*(p.done?1.6:1)+s,p.y+d[1]*(p.done?.3:1),d[3],d[3])}x.globalAlpha=1}
 const dx=dog.tx-dog.x,dy=dog.ty-dog.y,dd=Math.hypot(dx,dy);
 if(dd>2){dog.x+=dx/dd*Math.min(5,dd);dog.y+=dy/dd*Math.min(5,dd)}
 else if(busy){busy.shake=2;if(!busy.t0)busy.t0=t;if(t-busy.t0>35){busy.done=true;found.push(busy.loot[1]);
  document.getElementById('log').textContent='found: '+busy.loot[0];document.getElementById('found').textContent=found.join('');busy=null;
  if(piles.every(p=>p.done)){document.getElementById('log').textContent+=' · yard fully inspected. good dog.';document.getElementById('again').style.display='inline-block'}}}
 drawDog(dog.x,dog.y,busy&&dd<=2);requestAnimationFrame(frame)}
frame();
c.onclick=e=>{if(busy)return;const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;
 const p=piles.find(p=>!p.done&&Math.hypot(p.x-mx,p.y-my)<p.r+10);if(!p)return;busy=p;dog.tx=p.x-34;dog.ty=p.y+6;
 document.getElementById('log').textContent='sniff sniff sniff...'};
document.getElementById('again').onclick=yard;
document.getElementById('share').onclick=async()=>{const txt='my dog inspected the leaf piles and found: '+(found.join('')||'🍂')+' 🐾 http://imcharliethedog.com/go/leaves';
 if(navigator.share){try{await navigator.share({text:txt})}catch(e){}}else{navigator.clipboard&&navigator.clipboard.writeText(txt);document.getElementById('log').textContent='copied! paste it anywhere.'}};
</script></body></html>
